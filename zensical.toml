# The documentation, built with Zensical: uv run --group docs zensical serve
[project]
site_name = "delta-agent-evals"
site_url = "https://delta-agents.github.io/delta-agent-evals/"
site_description = "How good are an agent's answers? Measured with the verification statistics of water and weather science"
repo_url = "https://github.com/delta-agents/delta-agent-evals"
repo_name = "delta-agents/delta-agent-evals"
site_dir = "site"
extra_css = ["css/figures.css"]
extra_javascript = ["js/figures.js"]
nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Example usage" = [
    "example/index.md",
    { "Continuous errors" = "example/continuous-errors.md" },
    { "Yes or no" = "example/yes-or-no.md" },
    { "Maps" = "example/maps.md" },
    { "Ensembles" = "example/ensembles.md" },
    { "Skill and significance" = "example/skill-and-significance.md" },
    { "Probability words" = "example/probability-words.md" },
    { "Plain language" = "example/plain-language.md" },
  ] },
  { "How it works" = "how-it-works.md" },
  { "Background" = [
    { "Reading probability words" = "probability-phrases.md" },
    { "Reading water terms" = "water-terms.md" },
  ] },
  { "API reference" = "api.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.plugins.markdown-exec]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.show_source = false
options.show_root_heading = true
options.members_order = "source"
options.separate_signature = true
options.show_signature_annotations = true
options.filters = ["!^_"]

# llms.txt, llms-full.txt and a Markdown copy of each page listed here, for language models
[project.plugins.llmstxt]
markdown_description = "An agent's answer is the forecast, the reference answer the observation, and any metric of scores compares the two over a pydantic-evals dataset of questions."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Getting started" = [
  { "index.md" = "What it measures, and the steps of verify" },
  { "installation.md" = "Installation" },
]
"Examples" = [
  { "example/index.md" = "One kind of measure per page" },
  { "example/continuous-errors.md" = "Errors of a number" },
  { "example/yes-or-no.md" = "Yes or no, and a probability" },
  { "example/maps.md" = "A map per lead time" },
  { "example/ensembles.md" = "An ensemble" },
  { "example/skill-and-significance.md" = "Two agents side by side" },
  { "example/probability-words.md" = "Probability words, as readers take them" },
  { "example/plain-language.md" = "Water terms laypeople misread" },
]
"User guide" = [
  { "how-it-works.md" = "From answers to arrays, metrics and the result" },
  { "probability-phrases.md" = "How readers take probability words" },
  { "water-terms.md" = "Water terms laypeople read differently" },
  { "api.md" = "Generated from the docstrings" },
  { "contributing.md" = "Issues, pull requests and this site" },
]
