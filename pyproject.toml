[project]
name = "delta-agent-evals"
version = "0.4.0"
description = "Test Delta Agents with pydantic-evals and forecast verification from scores"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "HKV lijn in water" }]
dependencies = [
    "pydantic-evals>=2.75",
    "scores>=2.7",
    "numpy",
    "pandas",
    "xarray",
]

[project.optional-dependencies]
plot = ["pyobsplot>=0.5"]

[project.urls]
Homepage = "https://delta-agents.nl"
Repository = "https://github.com/delta-agents/delta-agent-evals"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
docs = [
    "markdown-exec>=1.14.0",
    "mkdocstrings-python>=2.0.11",
    "zensical>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_agent_evals"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
